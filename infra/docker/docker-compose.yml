version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: doc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_db
      POSTGRES_DB: job_processing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_processing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7
    container_name: doc-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: doc-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
      context: ../../services/api
      dockerfile: Dockerfile  
    container_name: doc-api
    environment:
      APP_NAME: doc-api
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: 8000

      DATABASE_URL: postgres://postgres:postgres_db@postgres:5432/job_processing_db
      REDIS_URL: redis://redis:6379/0

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET_NAME: documents
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "uvicorn app.main:app 
      --host 0.0.0.0
      --port 8000
      --reload"
    volumes:
      - ../../services/api:/app

  volumes:
    postgres_data:
    redis_data:
    minio_data: